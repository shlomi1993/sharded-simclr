name: CPU integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: PYTHON=python bash scripts/install.sh --dev --cpu
      - run: .sharded-simclr-venv/bin/python -m pytest -q
      - run: bash -n demo.sh scripts/sweep.sh scripts/install.sh
