name: CPU integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install-args: --dev --cpu
          - os: macos-latest
            install-args: --dev
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: PYTHON=python bash scripts/install.sh ${{ matrix.install-args }}
      - run: .sharded-simclr-venv/bin/python -m pytest -q
      - run: bash -n demo.sh scripts/sweep.sh scripts/install.sh
