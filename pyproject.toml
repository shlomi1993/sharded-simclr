[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharded-simclr-project"
version = "0.1.0"
description = "Manual two-stage ResNet18 sharding, contrastive training, and trace-driven tuning with PyTorch Distributed"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Shlomi Benshushan"}]
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "prettytable>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[tool.setuptools]
packages = ["src"]
py-modules = ["train", "analyze", "controller", "summarize_sweep"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
