<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" rx="18" fill="#f6f8fa"/>
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">Process topology (4 ranks, 2 replicas)</text>

  <!-- Replica 0 -->
  <rect x="60" y="80" width="420" height="440" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="270" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#57606a">REPLICA 0 · pair group (0, 1)</text>

  <rect x="110" y="135" width="320" height="120" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="270" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#0969da">Rank 0 · Stage 0</text>
  <text x="270" y="202" text-anchor="middle" font-size="15" fill="#1f2328">augment 2 views per image</text>
  <text x="270" y="226" text-anchor="middle" font-size="15" fill="#1f2328">conv1 … split layer</text>

  <rect x="110" y="370" width="320" height="120" rx="12" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
  <text x="270" y="407" text-anchor="middle" font-size="20" font-weight="700" fill="#bc4c00">Rank 1 · Stage 1</text>
  <text x="270" y="437" text-anchor="middle" font-size="15" fill="#1f2328">rest of ResNet18 + projection</text>
  <text x="270" y="461" text-anchor="middle" font-size="15" fill="#1f2328">contrastive loss</text>

  <line x1="225" y1="258" x2="225" y2="366" stroke="#0969da" stroke-width="3" marker-end="url(#blue)"/>
  <text x="215" y="318" text-anchor="end" font-size="14" fill="#0969da">activations</text>
  <line x1="315" y1="366" x2="315" y2="258" stroke="#bc4c00" stroke-width="3" marker-end="url(#orange)"/>
  <text x="325" y="310" font-size="14" fill="#bc4c00">boundary</text>
  <text x="325" y="328" font-size="14" fill="#bc4c00">gradients</text>

  <!-- Replica 1 -->
  <rect x="720" y="80" width="420" height="440" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="930" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#57606a">REPLICA 1 · pair group (2, 3)</text>

  <rect x="770" y="135" width="320" height="120" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="930" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#0969da">Rank 2 · Stage 0</text>
  <text x="930" y="202" text-anchor="middle" font-size="15" fill="#1f2328">augment 2 views per image</text>
  <text x="930" y="226" text-anchor="middle" font-size="15" fill="#1f2328">conv1 … split layer</text>

  <rect x="770" y="370" width="320" height="120" rx="12" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
  <text x="930" y="407" text-anchor="middle" font-size="20" font-weight="700" fill="#bc4c00">Rank 3 · Stage 1</text>
  <text x="930" y="437" text-anchor="middle" font-size="15" fill="#1f2328">rest of ResNet18 + projection</text>
  <text x="930" y="461" text-anchor="middle" font-size="15" fill="#1f2328">contrastive loss</text>

  <line x1="885" y1="258" x2="885" y2="366" stroke="#0969da" stroke-width="3" marker-end="url(#blue)"/>
  <text x="875" y="318" text-anchor="end" font-size="14" fill="#0969da">activations</text>
  <line x1="975" y1="366" x2="975" y2="258" stroke="#bc4c00" stroke-width="3" marker-end="url(#orange)"/>
  <text x="985" y="310" font-size="14" fill="#bc4c00">boundary</text>
  <text x="985" y="328" font-size="14" fill="#bc4c00">gradients</text>

  <!-- Stage groups -->
  <line x1="436" y1="195" x2="764" y2="195" stroke="#8250df" stroke-width="3" marker-start="url(#purple)" marker-end="url(#purple)"/>
  <text x="600" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">stage-0 group (even ranks)</text>
  <text x="600" y="218" text-anchor="middle" font-size="14" fill="#8250df">parameter broadcast + gradient all_reduce</text>

  <line x1="436" y1="430" x2="764" y2="430" stroke="#8250df" stroke-width="3" marker-start="url(#purple)" marker-end="url(#purple)"/>
  <text x="600" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">stage-1 group (odd ranks)</text>
  <text x="600" y="453" text-anchor="middle" font-size="14" fill="#8250df">parameter broadcast + embedding all_gather</text>
  <text x="600" y="472" text-anchor="middle" font-size="14" fill="#8250df">+ gradient all_reduce</text>

  <!-- World group -->
  <rect x="60" y="550" width="1080" height="70" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="600" y="580" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">World group (all ranks)</text>
  <text x="600" y="605" text-anchor="middle" font-size="15" fill="#57606a">metrics gather · final barrier</text>
</svg>
