<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="440" rx="18" fill="url(#bg)"/>

  <text x="700" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2328">Sharded SimCLR with PyTorch Distributed</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#57606a">Split the encoder across processes, train contrastively, profile every rank, tune the split and batch size</text>

  <!-- 1. Data -->
  <rect x="40" y="150" width="190" height="150" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#57606a">1 · DATA</text>
  <text x="135" y="220" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Synthetic images</text>
  <text x="135" y="245" text-anchor="middle" font-size="14" fill="#57606a">FakeData 224×224</text>
  <text x="135" y="268" text-anchor="middle" font-size="14" fill="#57606a">2 augmented views</text>

  <!-- 2. Stage 0 -->
  <rect x="280" y="150" width="210" height="150" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="385" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">2 · EVEN RANKS</text>
  <text x="385" y="220" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Stage 0</text>
  <text x="385" y="245" text-anchor="middle" font-size="14" fill="#57606a">ResNet18 up to the split</text>
  <text x="385" y="268" text-anchor="middle" font-size="14" fill="#57606a">(default: after layer2)</text>

  <!-- 3. Stage 1 -->
  <rect x="540" y="150" width="230" height="150" rx="14" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
  <text x="655" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#bc4c00">3 · ODD RANKS</text>
  <text x="655" y="220" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Stage 1 + loss</text>
  <text x="655" y="245" text-anchor="middle" font-size="14" fill="#57606a">rest of ResNet18, projection</text>
  <text x="655" y="268" text-anchor="middle" font-size="14" fill="#57606a">gathered contrastive loss</text>

  <!-- 4. Traces -->
  <rect x="820" y="150" width="190" height="150" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="915" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#57606a">4 · PROFILE</text>
  <text x="915" y="220" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Per-rank traces</text>
  <text x="915" y="245" text-anchor="middle" font-size="14" fill="#57606a">Chrome trace JSON</text>
  <text x="915" y="268" text-anchor="middle" font-size="14" fill="#57606a">metrics.csv</text>

  <!-- 5. Analyze -->
  <rect x="1060" y="150" width="300" height="150" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="1210" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">5 · ANALYZE &amp; TUNE</text>
  <text x="1210" y="220" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Fastest configuration</text>
  <text x="1210" y="245" text-anchor="middle" font-size="14" fill="#57606a">compute vs communication vs waiting</text>
  <text x="1210" y="268" text-anchor="middle" font-size="14" fill="#57606a">sweep batch size and split layer</text>

  <!-- forward arrows -->
  <line x1="232" y1="210" x2="276" y2="210" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="210" x2="536" y2="210" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="772" y1="225" x2="816" y2="225" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1012" y1="225" x2="1056" y2="225" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- gradient back arrow -->
  <line x1="536" y1="240" x2="494" y2="240" stroke="#bc4c00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="515" y="140" text-anchor="middle" font-size="13" fill="#0969da">activations →</text>
  <text x="515" y="325" text-anchor="middle" font-size="13" fill="#bc4c00">← boundary gradients</text>

  <!-- feedback loop -->
  <path d="M1210,302 C1210,395 385,395 385,304" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-green)"/>
  <text x="800" y="388" text-anchor="middle" font-size="14" fill="#1a7f37">rerun with a better batch size or split point</text>

  <text x="700" y="425" text-anchor="middle" font-size="13" fill="#8c959f">torch.distributed · Gloo · CPU · at least 4 processes (2 replicas)</text>
</svg>
